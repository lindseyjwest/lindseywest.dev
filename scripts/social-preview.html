<!doctype html>
<html lang="en">

    <style>

      figure { margin: 0; padding: 16px; background: #d9e5f4; box-shadow: 12px 12px 0 -4px #bda6c8; }
      img { display: block; width: 233px; height: 245px; object-fit: cover; }
      figcaption { padding-top: 12px; font: 500 12px/1.5 'IBM Plex Mono', monospace; letter-spacing: .06em; text-transform: uppercase; }
      footer { position: absolute; right: 64px; bottom: 48px; left: 64px; display: flex; justify-content: space-between; font: 500 13px/1.5 'IBM Plex Mono', monospace; letter-spacing: .06em; text-transform: uppercase; }

    </main>
    <footer><span>Salt Lake City, UT</span><span>Selected work &amp; professional experience</span></footer>
  </body>
</html>
